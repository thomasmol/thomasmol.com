services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: thomasmol
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d thomasmol"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  postgres-data:
